apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// -Pdual=true builds "Skyrim Dual" (com.tj.skyrim.dual): the HUD and
// favourites go to the second display. It installs next to the normal app;
// the native code is the same, so both builds share the CMake outputs.
def dual = project.hasProperty('dual') && project.property('dual') == 'true'

// -Pffmpeg=true|false forces LB_HAS_FFMPEG (default: auto if libs present)
def ffmpegProp = project.hasProperty('ffmpeg') ? project.property('ffmpeg').toString() : null

// CI supplies a monotonically increasing repository-wide versionCode and a
// human-readable versionName. Local builds retain the checked-in fallback.
def appVersionCode = project.hasProperty('versionCode')
    ? project.property('versionCode').toString().toInteger() : 23
def appVersionName = project.hasProperty('versionName')
    ? project.property('versionName').toString() : "0.21"

def ciSigningValues = [
    System.getenv("ANDROID_SIGNING_KEYSTORE"),
    System.getenv("ANDROID_SIGNING_STORE_PASSWORD"),
    System.getenv("ANDROID_SIGNING_KEY_ALIAS"),
    System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
]
def ciSigningConfigured = ciSigningValues.every { it != null && !it.isEmpty() }

android {
    namespace "com.tj.skyrim"
    compileSdkVersion 34
    ndkVersion project.hasProperty('ndkVersion') ? project.property('ndkVersion') : null
    defaultConfig {
        applicationId dual ? "com.tj.skyrim.dual" : "com.tj.skyrim"
        resValue "string", "app_name", dual ? "Skyrim Dual" : "Skyrim"
        buildConfigField "boolean", "DUAL", dual ? "true" : "false"
        minSdkVersion 28
        targetSdkVersion 29  // legacy storage: plain file access with the normal storage prompt
        versionCode appVersionCode
        versionName dual ? "${appVersionName}-dual" : appVersionName
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-28"
                if (ffmpegProp == 'true') {
                    arguments "-DLB_HAS_FFMPEG=ON"
                } else if (ffmpegProp == 'false') {
                    arguments "-DLB_HAS_FFMPEG=OFF"
                }
                abiFilters 'arm64-v8a'
            }
        }
    }
    signingConfigs {
        if (ciSigningConfigured) {
            ci {
                storeFile file(System.getenv("ANDROID_SIGNING_KEYSTORE"))
                storePassword System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        // The recompiled game is large; debug builds would be unusably slow.
        // CI uses one persistent keystore for every build so Android can update
        // an installed APK. Local builds keep the standard debug key.
        debug {
            externalNativeBuild { cmake { arguments "-DCMAKE_BUILD_TYPE=Release" } }
            debuggable true
            jniDebuggable false
            if (ciSigningConfigured) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            signingConfig ciSigningConfigured ? signingConfigs.ci : signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
            version '3.22.1'
        }
    }
    // Pick up prebuilt libavcodec.so / libavutil.so from jni/ffmpeg/lib/arm64-v8a/
    sourceSets {
        main {
            jniLibs.srcDirs += ['jni/ffmpeg/lib']
        }
    }
    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    lint { abortOnError false }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
