name: Build & Publish APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Явное имя версии. Пусто = автоматическая версия 0.21.<run_number>"
        required: false
        type: string
      dual:
        description: "Также собрать dual-версию"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Создать GitHub Release"
        required: false
        type: boolean
        default: true
      gen_url:
        description: "URL на архив gen/ (tar.xz / tar.gz / zip). Обязательно, если gen/ нет в runner"
        required: false
        type: string

  push:
    tags:
      - "v*"

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Рекомендуется self-hosted с ≥16 GB RAM

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Restore / download gen/
        run: |
          set -e
          if [ -d "gen" ] && [ -n "$(ls -A gen 2>/dev/null)" ]; then
            echo "gen/ уже есть на runner"
            find gen -name '*.c' | wc -l
            exit 0
          fi

          if [ -z "${{ github.event.inputs.gen_url }}" ]; then
            echo "::error::Каталог gen/ отсутствует."
            echo ""
            echo "Варианты:"
            echo "1. Сгенерируйте локально: tools/regen_gen.sh /path/to/GAME"
            echo "2. Упакуйте: tar -cJf gen.tar.xz gen/"
            echo "3. Загрузите архив куда-нибудь (GitHub Release, private storage, GDrive с прямой ссылкой)"
            echo "4. При запуске workflow укажите URL в поле gen_url"
            echo ""
            echo "Или используйте self-hosted runner, где gen/ уже лежит."
            exit 1
          fi

          echo "Скачиваю gen из ${{ github.event.inputs.gen_url }}"
          mkdir -p /tmp/gen_dl
          curl -L --fail --retry 3 -o /tmp/gen_dl/gen.archive "${{ github.event.inputs.gen_url }}"

          if file /tmp/gen_dl/gen.archive | grep -q 'XZ\|xz'; then
            tar -xJf /tmp/gen_dl/gen.archive
          elif file /tmp/gen_dl/gen.archive | grep -q 'gzip\|Gzip'; then
            tar -xzf /tmp/gen_dl/gen.archive
          elif file /tmp/gen_dl/gen.archive | grep -q 'Zip\|zip'; then
            unzip -q /tmp/gen_dl/gen.archive
          else
            tar -xJf /tmp/gen_dl/gen.archive || tar -xzf /tmp/gen_dl/gen.archive
          fi

          if [ ! -d "gen" ] || [ -z "$(ls -A gen 2>/dev/null)" ]; then
            echo "::error::После распаковки gen/ всё ещё пуст. Проверьте структуру архива (должен быть каталог gen/ в корне)."
            exit 1
          fi

          echo "gen/ успешно восстановлен, файлов C: $(find gen -name '*.c' | wc -l)"
          rm -rf /tmp/gen_dl

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install host Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Install NDK, CMake, platforms
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Determine version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            VER="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="0.21.${GITHUB_RUN_NUMBER}"
          fi
          # Shared repository-wide sequence across both APK workflows.
          VERSION_CODE=$((1000000000 + (GITHUB_RUN_ID % 1000000000)))
          if (( VERSION_CODE > 2100000000 || VERSION_CODE < 1 )); then
            echo "::error::Generated Android versionCode is outside the supported range."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [[ ! "$VER" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]]; then
            echo "::error::Version name contains unsupported characters."
            exit 1
          fi
          echo "APK versionName=$VER versionCode=$VERSION_CODE"

      - name: Configure persistent APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Persistent APK signing is not configured."
            echo "Add repository Actions secrets: ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_SIGNING_STORE_PASSWORD, ANDROID_SIGNING_KEY_ALIAS, ANDROID_SIGNING_KEY_PASSWORD."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/skyrim-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "ANDROID_SIGNING_KEYSTORE=$KEYSTORE_PATH"
            echo "ANDROID_SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent signing keystore configured."

      - name: Build main APK
        timeout-minutes: 105
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.stacktrace=all"
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          echo "=== Build started: $(date -u) ==="
          echo "=== Runner resources ==="
          nproc
          free -h
          df -h .
          ./gradlew assembleDebug \
            -PndkVersion=${{ env.NDK_VERSION }} \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon \
            --info \
            --console=plain \
            --stacktrace 2>&1 | tee ../build-main.log
          echo "=== Build finished: $(date -u) ==="
          mkdir -p ../dist
          MAIN_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$MAIN_APK"
          cp "$MAIN_APK" "../dist/Skyrim-${{ steps.ver.outputs.version }}.apk"

      - name: Diagnose failed or timed-out build
        if: failure() || cancelled()
        run: |
          echo "=== Build diagnostics: $(date -u) ==="
          echo "--- Processes ---"
          ps -eo pid,ppid,stat,etime,%cpu,%mem,cmd --sort=-%cpu | head -40 || true
          echo "--- Memory ---"
          free -h || true
          echo "--- Disk ---"
          df -h || true
          echo "--- Gradle/CMake/Ninja log tail ---"
          tail -n 250 build-main.log 2>/dev/null || true
          echo "--- Native build diagnostic files ---"
          find android/app/.cxx -type f \( -name 'CMakeError.log' -o -name 'CMakeOutput.log' -o -name 'build.ninja' -o -name '*.ninja_log' \) -print 2>/dev/null | head -100 || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build-main.log
            android/app/.cxx/**/CMakeFiles/CMakeError.log
            android/app/.cxx/**/CMakeFiles/CMakeOutput.log
            android/app/.cxx/**/build.ninja
            android/app/.cxx/**/.ninja_log
          if-no-files-found: warn
          retention-days: 7

      - name: Build dual APK (optional)
        if: github.event.inputs.dual == 'true'
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
        run: |
          ./gradlew assembleDebug \
            -PndkVersion=${{ env.NDK_VERSION }} \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            -Pdual=true \
            --no-daemon \
            --info \
            --console=plain \
            --stacktrace
          DUAL_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$DUAL_APK"
          cp "$DUAL_APK" "../dist/Skyrim-${{ steps.ver.outputs.version }}-dual.apk"

      - name: Verify APK package, version and signing certificate
        id: prep
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APK_SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          VERSION_CODE="${{ steps.ver.outputs.version_code }}"
          VERSION_NAME="${{ steps.ver.outputs.version }}"
          verify_apk() {
            local apk="$1"
            local expected_package="$2"
            local expected_name="$3"
            local badging
            badging=$("$AAPT" dump badging "$apk" | head -n 1)
            echo "$badging"
            [[ "$badging" == *"name='$expected_package'"* ]] || {
              echo "::error::Unexpected applicationId in $apk"
              exit 1
            }
            [[ "$badging" == *"versionCode='$VERSION_CODE'"* ]] || {
              echo "::error::APK versionCode does not match CI sequence."
              exit 1
            }
            [[ "$badging" == *"versionName='$expected_name'"* ]] || {
              echo "::error::APK versionName does not match release metadata."
              exit 1
            }
            "$APK_SIGNER" verify --verbose "$apk"
            "$APK_SIGNER" verify --print-certs "$apk" | grep "Signer #1 certificate SHA-256 digest:"
          }
          verify_apk "dist/Skyrim-$VERSION_NAME.apk" "com.tj.skyrim" "$VERSION_NAME"
          if [[ -f "dist/Skyrim-$VERSION_NAME-dual.apk" ]]; then
            verify_apk "dist/Skyrim-$VERSION_NAME-dual.apk" "com.tj.skyrim.dual" "$VERSION_NAME-dual"
          fi
          {
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "applicationId=com.tj.skyrim"
            echo "signing=repository-persistent-keystore"
          } > dist/build-info.txt
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-APK-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Skyrim for Android ${{ steps.ver.outputs.version }}
          body: |
            ## Skyrim for Android ${{ steps.ver.outputs.version }}

            **APK:** `Skyrim-${{ steps.ver.outputs.version }}.apk` (arm64-v8a, Android 9+, Vulkan 1.1)

            ### Требования
            - arm64 устройство
            - Android 9+
            - Vulkan 1.1
            - Собственные файлы игры (TESV.exe + Data/ и т.д.)

            При проблемах прикладывайте `port/log.txt` из папки Skyrim.
          files: |
            dist/Skyrim-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
