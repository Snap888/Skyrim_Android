name: Build & Publish APK

on:
  # Ручной запуск
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (например 0.24). Оставьте пустым — возьмётся из build.gradle"
        required: false
        type: string
      dual:
        description: "Также собрать dual-версию (второй экран)"
        required: false
        type: boolean
        default: false
      create_release:
        description: "Создать GitHub Release и загрузить APK"
        required: false
        type: boolean
        default: true

  # Автоматически при пуше тега v*
  push:
    tags:
      - "v*"

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"
  JAVA_VERSION: "17"

permissions:
  contents: write   # нужно для создания релизов

jobs:
  build:
    runs-on: ubuntu-latest
    # Рекомендуется self-hosted runner с ≥16 GB RAM,
    # иначе сборка gen/*.c может упасть по OOM (каждый файл требует 1–2 GB).

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check that gen/ exists
        run: |
          if [ ! -d "gen" ] || [ -z "$(ls -A gen 2>/dev/null)" ]; then
            echo "::error::Каталог gen/ отсутствует или пуст."
            echo "Сначала выполните локально: tools/regen_gen.sh /path/to/GAME"
            echo "Затем либо положите gen/ на self-hosted runner, либо загрузите как artifact."
            exit 1
          fi
          echo "gen/ найден, файлов: $(find gen -name '*.c' | wc -l)"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake, platforms
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            # читаем из build.gradle
            VER=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle | head -1)
            VER=${VER:-"0.0.0"}
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Сборка версии: $VER"

      - name: Build main APK (debug = optimised)
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -PndkVersion=${{ env.NDK_VERSION }} \
            --no-daemon \
            --stacktrace

      - name: Build dual APK (optional)
        if: github.event.inputs.dual == 'true' || contains(github.event.head_commit.message, '[dual]')
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -PndkVersion=${{ env.NDK_VERSION }} \
            -Pdual=true \
            --no-daemon \
            --stacktrace

      - name: Prepare artifacts
        id: prep
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist

          # Основной APK
          MAIN_APK=$(find android/app/build/outputs/apk -name "app-debug.apk" | head -1)
          if [ -z "$MAIN_APK" ]; then
            echo "::error::APK не найден"
            exit 1
          fi
          cp "$MAIN_APK" "dist/Skyrim-${VER}.apk"
          echo "main_apk=dist/Skyrim-${VER}.apk" >> $GITHUB_OUTPUT

          # Dual (если есть)
          DUAL_APK=$(find android/app/build/outputs/apk -name "app-debug.apk" -path "*/dual/*" 2>/dev/null | head -1 || true)
          if [ -n "$DUAL_APK" ]; then
            cp "$DUAL_APK" "dist/Skyrim-${VER}-dual.apk"
            echo "dual_apk=dist/Skyrim-${VER}-dual.apk" >> $GITHUB_OUTPUT
          fi

          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-APK-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      # ---------- Release ----------
      - name: Create GitHub Release
        if: |
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Skyrim for Android ${{ steps.ver.outputs.version }}
          body: |
            ## Skyrim for Android ${{ steps.ver.outputs.version }}

            **APK:** `Skyrim-${{ steps.ver.outputs.version }}.apk` (arm64-v8a, Android 9+, Vulkan 1.1)

            ### Требования
            - arm64 устройство
            - Android 9+
            - Vulkan 1.1
            - Собственные файлы игры (TESV.exe + Data/ и т.д.)

            При проблемах прикладывайте `port/log.txt` из папки Skyrim.
          files: |
            dist/Skyrim-*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
