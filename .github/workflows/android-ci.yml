name: Android CI

on:
  push:
    branches:
      - snap-patch-3
      - Snap-AI-EngineFrame
  pull_request:
    branches:
      - snap-patch-3
      - Snap-AI-EngineFrame
  workflow_dispatch:
    inputs:
      gen_url:
        description: "URL to a gen/ archive (tar.xz, tar.gz or zip) for a full APK build"
        required: false
        type: string
      build_apk:
        description: "Build the complete APK (requires gen/ or gen_url)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.22.1"

jobs:
  snapframe-log-analyzer:
    name: SnapFrame log analyzer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test local diagnostic report generator
        run: python3 -m unittest discover -s tools/tests -p 'test_analyze_snapframe_logs.py' -v

  java:
    name: Android Java compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Compile launcher Java
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon --stacktrace --console=plain

  portable-android-arm64:
    name: Snap AI + SnapFrame portable ARM64 build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "cmake;${{ env.CMAKE_VERSION }}" "ndk;${{ env.NDK_VERSION }}"

      - name: Checkout pinned Snap AI Engine source
        run: |
          git clone https://github.com/Snap888/Snap_AI_Engine.git "$RUNNER_TEMP/snap-ai-engine"
          git -C "$RUNNER_TEMP/snap-ai-engine" checkout ccf4589ca19d5f788adc56c7248d94f83ca0a506

      - name: Configure portable libraries for Android ARM64
        run: |
          cmake -S "$RUNNER_TEMP/snap-ai-engine" -B "$RUNNER_TEMP/snap-ai-engine-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSNAP_AI_BUILD_TESTS=OFF \
            -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=OFF \
            -DSNAP_FRAME_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_DXVK_LEGACY=OFF

      - name: Build portable Android libraries
        run: cmake --build "$RUNNER_TEMP/snap-ai-engine-build" --parallel 2

  portable-api-tests:
    name: Snap AI and SnapFrame portable API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned Snap AI Engine source
        run: |
          git clone https://github.com/Snap888/Snap_AI_Engine.git "$RUNNER_TEMP/snap-ai-tests"
          git -C "$RUNNER_TEMP/snap-ai-tests" checkout ccf4589ca19d5f788adc56c7248d94f83ca0a506

      - name: Configure portable unit tests
        run: |
          cmake -S "$RUNNER_TEMP/snap-ai-tests" -B "$RUNNER_TEMP/snap-ai-tests-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DSNAP_AI_BUILD_TESTS=ON \
            -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=ON \
            -DSNAP_FRAME_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_DXVK_LEGACY=OFF

      - name: Build and run portable unit tests
        run: |
          cmake --build "$RUNNER_TEMP/snap-ai-tests-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/snap-ai-tests-build" --output-on-failure

  snapframe-dxvk-host-arm64:
    name: Skyrim DXVK SnapFrame host ARM64 compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "cmake;${{ env.CMAKE_VERSION }}" "ndk;${{ env.NDK_VERSION }}"

      - name: Install Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Configure Skyrim native build
        run: |
          mkdir -p gen
          printf 'void snapframe_ci_dummy(void) {}\n' > gen/snapframe_ci_dummy.c
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" \
            -S android/app/jni \
            -B "$RUNNER_TEMP/skyrim-native-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLB_GEN_JOBS=1 \
            -DLB_HAS_FFMPEG=OFF \
            -DSNAP_AI_BUILD_TESTS=OFF \
            -DSNAP_AI_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_TESTS=OFF \
            -DSNAP_FRAME_BUILD_EXAMPLE=OFF \
            -DSNAP_FRAME_BUILD_DXVK_LEGACY=OFF \
            -DSNAP_DXVK_LINKAGE_CHECK=ON

      - name: Compile the DXVK host and JNI settings bridge
        run: |
          "$ANDROID_HOME/cmake/$CMAKE_VERSION/bin/cmake" \
            --build "$RUNNER_TEMP/skyrim-native-build" \
            --target dxvk_d3d9 dxvk_linkage_check snapframe_host snapframe_jni_compile_check --parallel 2
          DXVK_SO=$(find "$RUNNER_TEMP/skyrim-native-build" -type f -name 'libdxvk_d3d9.so' -print -quit)
          LINK_CHECK_SO=$(find "$RUNNER_TEMP/skyrim-native-build" -type f -name 'libdxvk_linkage_check.so' -print -quit)
          READELF="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          NM="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          bash -n tools/ci/verify_dxvk_runtime_pair.sh
          bash tools/ci/verify_dxvk_runtime_pair.sh \
            "$DXVK_SO" "$LINK_CHECK_SO" "$READELF" "$NM" "libdxvk_d3d9.so"

  dxvk-native-262-source-inventory:
    name: DXVK Native 2.6.2 Android source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Skyrim Android integration
        uses: actions/checkout@v4

      - name: Test DXVK source inventory parser
        run: python3 -m unittest discover -s tools/tests -p 'test_dxvk_native_manifest.py' -v

      - name: Checkout pinned DXVK Native 2.6.2
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/doitsujin/dxvk.git "$RUNNER_TEMP/dxvk-native-262"
          git -C "$RUNNER_TEMP/dxvk-native-262" fetch --depth=1 origin 9d6f54a1ade20d1d27dd421024717a636f3d8c68
          git -C "$RUNNER_TEMP/dxvk-native-262" checkout --detach 9d6f54a1ade20d1d27dd421024717a636f3d8c68
          test "$(git -C "$RUNNER_TEMP/dxvk-native-262" rev-parse HEAD)" = "9d6f54a1ade20d1d27dd421024717a636f3d8c68"

      - name: Apply Android Presenter and WSI overlay
        run: |
          python3 -m py_compile tools/dxvk/apply_native_262_android_port.py
          python3 tools/dxvk/apply_native_262_android_port.py \
            "$RUNNER_TEMP/dxvk-native-262" --project-root "$GITHUB_WORKSPACE"
          grep -q 'cNativeWindow = nativeWindow' "$RUNNER_TEMP/dxvk-native-262/src/d3d9/d3d9_swapchain.cpp"
          grep -q 'cHasNativeWindow' "$RUNNER_TEMP/dxvk-native-262/src/d3d9/d3d9_swapchain.cpp"
          grep -q 'vkCreateAndroidSurfaceKHR' "$RUNNER_TEMP/dxvk-native-262/src/wsi/sdl2/wsi_platform_sdl2.cpp"
          grep -q 'VK_KHR_android_surface' "$RUNNER_TEMP/dxvk-native-262/src/wsi/sdl2/wsi_platform_sdl2.cpp"
          grep -q '#include <cstring>' "$RUNNER_TEMP/dxvk-native-262/src/wsi/sdl2/wsi_platform_sdl2.cpp"
          grep -q 'extensionName && std::strcmp' "$RUNNER_TEMP/dxvk-native-262/src/wsi/sdl2/wsi_platform_sdl2.cpp"
          test -s "$RUNNER_TEMP/dxvk-native-262/src/wsi/sdl2/wsi_native_surface.cpp"
          git -C "$RUNNER_TEMP/dxvk-native-262" diff --check
          bash -n tools/dxvk/checkout_native_262_source.sh
          echo "DXVK_NATIVE_262_ANDROID_PRESENTER_PATCH_OK"

      - name: Generate and validate Android source inventory
        run: |
          python3 -m py_compile tools/dxvk/generate_native_262_android_manifest.py
          python3 tools/dxvk/generate_native_262_android_manifest.py \
            "$RUNNER_TEMP/dxvk-native-262" \
            --output "$RUNNER_TEMP/dxvk-native-262-android-source-manifest.json"
          python3 -m json.tool "$RUNNER_TEMP/dxvk-native-262-android-source-manifest.json" >/dev/null
          python3 - "$RUNNER_TEMP/dxvk-native-262-android-source-manifest.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          groups = manifest["groups"]
          build_groups = manifest["build_groups"]
          assert "wsi_common" in build_groups and "android_wsi" in build_groups
          assert "wsi_excluded_desktop" not in build_groups
          assert len(groups["wsi_common"]) == 2
          assert len(groups["android_wsi"]) == 3
          assert groups["android_wsi_overlay"] == ["src/wsi/sdl2/wsi_native_surface.cpp"]
          assert "android_wsi_overlay" in build_groups
          assert "spirv" in build_groups
          assert len(groups["spirv"]) == 3
          assert len(groups["d3d9_shaders"]) == 7
          assert len(groups["dxvk_shaders"]) > 0
          assert all(path.endswith((".comp", ".frag", ".vert", ".geom")) for path in groups["d3d9_shaders"] + groups["dxvk_shaders"])
          assert len(manifest["duplicate_android_build_sources"]) == 0
          assert all(path.startswith("src/wsi/") for path in groups["android_wsi"])
          assert all(
              any(name in path for name in ("win32/", "sdl3/", "glfw/"))
              for path in groups["wsi_excluded_desktop"]
          )
          print("DXVK_NATIVE_262_ANDROID_WSI_PARTITION_OK")
          PY

      - name: Upload reviewed source inventory
        uses: actions/upload-artifact@v4
        with:
          name: dxvk-native-2.6.2-android-source-inventory
          path: ${{ runner.temp }}/dxvk-native-262-android-source-manifest.json
          retention-days: 14

  apk:
    name: Full arm64 APK build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore generated game code
        env:
          GEN_URL: ${{ inputs.gen_url }}
        run: |
          set -euo pipefail
          if [ -d gen ] && [ -n "$(find gen -type f -name '*.c' -print -quit)" ]; then
            echo "Using gen/ from checkout."
          elif [ -n "${GEN_URL}" ]; then
            mkdir -p /tmp/gen
            curl --fail --location --retry 3 "${GEN_URL}" -o /tmp/gen/archive
            if file /tmp/gen/archive | grep -qi 'zip'; then
              unzip -q /tmp/gen/archive -d /tmp/gen/unpacked
            elif file /tmp/gen/archive | grep -qi 'gzip'; then
              mkdir -p /tmp/gen/unpacked
              tar -xzf /tmp/gen/archive -C /tmp/gen/unpacked
            else
              mkdir -p /tmp/gen/unpacked
              tar -xJf /tmp/gen/archive -C /tmp/gen/unpacked
            fi
            if [ -d /tmp/gen/unpacked/gen ]; then
              cp -a /tmp/gen/unpacked/gen ./gen
            elif [ -n "$(find /tmp/gen/unpacked -type f -name '*.c' -print -quit)" ]; then
              mkdir -p gen
              find /tmp/gen/unpacked -type f -name '*.c' -exec cp {} gen/ \;
            fi
          else
            echo "::error::gen/ is not stored in Git. Supply gen_url or use a runner containing gen/."
            exit 1
          fi
          test -n "$(find gen -type f -name '*.c' -print -quit)" || {
            echo "::error::The archive did not contain generated C sources."
            exit 1
          }
          echo "Generated C files: $(find gen -type f -name '*.c' | wc -l)"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install host Vulkan shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools

      - name: Install NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;${{ env.CMAKE_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"

      - name: Determine APK version
        id: ver
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000000000 + (GITHUB_RUN_ID % 1000000000)))
          VERSION_NAME="0.21.${GITHUB_RUN_NUMBER}"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.stacktrace=all"
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug \
            -PndkVersion=${{ env.NDK_VERSION }} \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME" \
            --no-daemon --stacktrace --info --console=plain
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APK_SIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          BADGING_OUTPUT=$("$AAPT" dump badging "$APK")
          BADGING=$(printf '%s\n' "$BADGING_OUTPUT" | sed -n '1p')
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.tj.skyrim'"* ]]
          [[ "$BADGING" == *"versionCode='$VERSION_CODE'"* ]]
          [[ "$BADGING" == *"versionName='$VERSION_NAME'"* ]]
          "$APK_SIGNER" verify --verbose "$APK"
          CERT_OUTPUT=$("$APK_SIGNER" verify --print-certs "$APK")
          [[ "$CERT_OUTPUT" == *"Signer #1 certificate SHA-256 digest:"* ]]
          printf '%s\n' "$CERT_OUTPUT" | sed -n '/Signer #1 certificate SHA-256 digest:/p'
          mkdir -p ../dist
          cp "$APK" "../dist/Skyrim-$VERSION_NAME.apk"
          {
            echo "commit=$GITHUB_SHA"
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
            echo "applicationId=com.tj.skyrim"
          } > ../dist/build-info.txt

      - name: Upload APK and native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skyrim-Android-${{ github.sha }}
          path: |
            dist/*.apk
            dist/build-info.txt
            android/app/.cxx/**/CMakeFiles/CMakeError.log
            android/app/.cxx/**/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn
          retention-days: 14
